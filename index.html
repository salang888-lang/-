<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дымный Гурман — Калькулятор и Себестоимость</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #1e0e10;
            color: #f1e0d6;
            margin: 0;
            padding: 16px;
        }
        h2, h3 { margin-top: 0; color: #f1e0d6; }
        .card {
            background-color: #2b1417;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid #3e1e22;
        }
        select, input, button {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #522429;
            background: #3e1e22;
            color: white;
            box-sizing: border-box;
            font-size: 15px;
            margin-bottom: 8px;
        }
        .weight-input {
            background: #522429;
            border: 2px solid #d3524b;
            font-weight: bold;
            font-size: 18px;
            text-align: center;
        }
        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #38191d;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 6px;
        }
        .row-name { font-size: 14px; flex: 2; }
        .row-val { font-size: 14px; font-weight: bold; color: #ff9d9d; flex: 1; text-align: right; }
        .row-cost { font-size: 13px; color: #a08a8a; flex: 1; text-align: right; }
        .fin-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px dashed #522429;
            font-size: 14px;
        }
        .fin-row strong { color: #52d37c; }
        .btn-main {
            background: #d3524b;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
            padding: 12px;
        }
        .btn-sec {
            background: #522429;
            color: white;
            border: none;
            cursor: pointer;
        }
        .btn-danger {
            background: transparent;
            color: #d3524b;
            border: 1px solid #d3524b;
            margin-top: 10px;
            cursor: pointer;
        }
        .ing-edit-row {
            display: flex;
            gap: 6px;
            margin-bottom: 6px;
        }
    </style>
</head>
<body>

    <h2>🥩 Дымный Гурман</h2>

    <!-- ВЫБОР РЕЦЕПТА -->
    <div class="card">
        <label style="font-size: 12px; color: #a08a8a;">Выберите рецепт:</label>
        <select id="recipeSelect" onchange="loadSelectedRecipe()"></select>
        <button class="btn-sec" onclick="showNewRecipeForm()">➕ Добавить рецепт</button>
    </div>

    <!-- РАСЧЕТ И СЕБЕСТОИМОСТЬ -->
    <div class="card" id="calculatorBlock">
        <h3>Пересчёт партии и финансовый расчет</h3>
        
        <label style="font-size: 12px; color: #a08a8a;">Фактический вес мясного сырья (кг):</label>
        <input type="number" id="meatWeight" class="weight-input" value="1.0" step="0.1" oninput="calculate()">

        <div style="display: flex; gap: 8px;">
            <div style="flex: 1;">
                <label style="font-size: 12px; color: #a08a8a;">Выход готового (%):</label>
                <input type="number" id="yieldPercent" value="80" step="1" oninput="calculate()">
            </div>
            <div style="flex: 1;">
                <label style="font-size: 12px; color: #a08a8a;">Цена продажи (грн/кг):</label>
                <input type="number" id="sellPrice" placeholder="0" oninput="calculate()">
            </div>
        </div>

        <h4 style="margin-bottom: 8px; color: #d3524b;">Ингредиенты партии:</h4>
        <div id="resultsList"></div>

        <h4 style="margin-bottom: 8px; margin-top: 16px; color: #52d37c;">Итоговые финансовые показатели:</h4>
        <div id="financialBlock">
            <!-- Сюда выводится экономика партии -->
        </div>

        <button class="btn-danger" onclick="deleteCurrentRecipe()">🗑 Удалить этот рецепт</button>
    </div>

    <!-- ФОРМА СОЗДАНИЯ/РЕДАКТИРОВАНИЯ -->
    <div class="card" id="newRecipeBlock" style="display: none;">
        <h3 id="formTitle">Новый рецепт (пропорции на 1 кг мяса)</h3>
        <input type="text" id="newRecipeName" placeholder="Название рецепта">
        <label style="font-size: 12px; color: #a08a8a;">Выход готовой продукции по умолчанию (%):</label>
        <input type="number" id="newYieldPercent" value="80">

        <div style="display: flex; gap: 6px; font-size: 11px; color: #a08a8a; margin-top: 8px;">
            <span style="flex:2;">Название</span>
            <span style="width:70px;">г/кг</span>
            <span style="width:80px;">Цена за кг/л</span>
        </div>
        
        <div id="newIngredientsInputs"></div>
        
        <button class="btn-sec" onclick="addIngredientInput()">+ Добавить ингредиент/специю</button>
        <button class="btn-main" style="margin-top: 10px;" onclick="saveRecipe()">💾 Сохранить рецепт</button>
        <button class="btn-sec" style="margin-top: 5px; background: transparent;" onclick="cancelNewRecipe()">Отмена</button>
    </div>

<script>
// Стандартные рецепты с ориентировочными ценами за кг сырья/специй
let defaultRecipes = {
    "Краковская": {
        yieldPercent: 80,
        ingredients: [
            { name: "Свинина полужирная", gramsPerKg: 700, pricePerKg: 180 },
            { name: "Грудинка свиная", gramsPerKg: 300, pricePerKg: 160 },
            { name: "Вода ледяная", gramsPerKg: 100, pricePerKg: 0 },
            { name: "Соль нитритная (0.5%)", gramsPerKg: 18, pricePerKg: 40 },
            { name: "Сахар", gramsPerKg: 3, pricePerKg: 30 },
            { name: "Перец чёрный молотый", gramsPerKg: 2, pricePerKg: 400 },
            { name: "Кориандр молотый", gramsPerKg: 1, pricePerKg: 250 },
            { name: "Мускатный орех", gramsPerKg: 0.5, pricePerKg: 600 },
            { name: "Чеснок гранулированный", gramsPerKg: 2, pricePerKg: 200 },
            { name: "Фосфат пищевой", gramsPerKg: 2, pricePerKg: 220 },
            { name: "Оболочка (на 1кг мяса)", gramsPerKg: 1, pricePerKg: 15 } // 15 грн на кг
        ]
    },
    "Кабаноси": {
        yieldPercent: 60,
        ingredients: [
            { name: "Мясное сырье (нежирное)", gramsPerKg: 1000, pricePerKg: 190 },
            { name: "Соль нитритная", gramsPerKg: 20, pricePerKg: 40 },
            { name: "Перец чёрный молотый", gramsPerKg: 2, pricePerKg: 400 },
            { name: "Паприка копчёная", gramsPerKg: 3, pricePerKg: 350 },
            { name: "Чеснок гранулированный", gramsPerKg: 2, pricePerKg: 200 },
            { name: "Стартовые культуры (BioStart)", gramsPerKg: 0.6, pricePerKg: 2500 }
        ]
    }
};

let recipes = JSON.parse(localStorage.getItem('dg_cost_recipes')) || defaultRecipes;

function init() {
    const select = document.getElementById('recipeSelect');
    select.innerHTML = '';
    for (let name in recipes) {
        let opt = document.createElement('option');
        opt.value = name;
        opt.innerText = name;
        select.appendChild(opt);
    }
    loadSelectedRecipe();
}

function loadSelectedRecipe() {
    const recipeName = document.getElementById('recipeSelect').value;
    if (recipeName && recipes[recipeName]) {
        document.getElementById('yieldPercent').value = recipes[recipeName].yieldPercent || 80;
    }
    calculate();
}

function calculate() {
    const recipeName = document.getElementById('recipeSelect').value;
    const meatKg = parseFloat(document.getElementById('meatWeight').value) || 0;
    const yieldPercent = parseFloat(document.getElementById('yieldPercent').value) || 100;
    const sellPrice = parseFloat(document.getElementById('sellPrice').value) || 0;
    
    const resultsList = document.getElementById('resultsList');
    const financialBlock = document.getElementById('financialBlock');
    
    if (!recipeName || !recipes[recipeName]) {
        resultsList.innerHTML = '<div style="color:#a08a8a; text-align:center;">Нет данных</div>';
        financialBlock.innerHTML = '';
        return;
    }

    const ingredients = recipes[recipeName].ingredients;
    resultsList.innerHTML = '';
    let totalBatchCost = 0;

    ingredients.forEach(item => {
        const totalGrams = (item.gramsPerKg * meatKg).toFixed(1);
        // Расчет стоимости компонента
        const itemCost = ((item.gramsPerKg * meatKg) / 1000) * (item.pricePerKg || 0);
        totalBatchCost += itemCost;

        const row = document.createElement('div');
        row.className = 'row';
        row.innerHTML = `
            <span class="row-name">${item.name}</span>
            <span class="row-val">${totalGrams} г</span>
            <span class="row-cost">${itemCost.toFixed(2)} грн</span>
        `;
        resultsList.appendChild(row);
    });

    // Расчет готового веса и себестоимости 1 кг готового продукта
    const readyWeightKg = (meatKg * (yieldPercent / 100)).toFixed(2);
    const costPerKgReady = readyWeightKg > 0 ? (totalBatchCost / readyWeightKg).toFixed(2) : 0;
    
    const revenue = (readyWeightKg * sellPrice).toFixed(2);
    const profit = (revenue - totalBatchCost).toFixed(2);

    financialBlock.innerHTML = `
        <div class="fin-row"><span>Себестоимость всей партии:</span> <span><strong>${totalBatchCost.toFixed(2)} грн</strong></span></div>
        <div class="fin-row"><span>Вес готового продукта (${yieldPercent}%):</span> <span><strong>${readyWeightKg} кг</strong></span></div>
        <div class="fin-row"><span>Себестоимость 1 кг готового:</span> <span style="color:#ff9d9d; font-weight:bold;">${costPerKgReady} грн/кг</span></div>
        ${sellPrice > 0 ? `
            <div class="fin-row"><span>Выручка от продажи:</span> <span>${revenue} грн</span></div>
            <div class="fin-row"><span>Чистая прибыль:</span> <span style="color:#52d37c; font-weight:bold;">${profit} грн</span></div>
        ` : ''}
    `;
}

function showNewRecipeForm() {
    document.getElementById('newRecipeBlock').style.display = 'block';
    document.getElementById('calculatorBlock').style.display = 'none';
    document.getElementById('newIngredientsInputs').innerHTML = '';
    document.getElementById('newRecipeName').value = '';
    
    // Дефолтные строки
    addIngredientInput("Свинина", 1000, 180);
    addIngredientInput("Соль нитритная", 18, 40);
    addIngredientInput("Перец чёрный", 2, 400);
}

function addIngredientInput(defaultName = '', defaultGrams = '', defaultPrice = '') {
    const div = document.createElement('div');
    div.className = 'ing-edit-row';
    div.innerHTML = `
        <input type="text" placeholder="Название" class="ing-name" value="${defaultName}" style="flex:2;">
        <input type="number" step="0.1" placeholder="г/кг" class="ing-grams" value="${defaultGrams}" style="width:70px;">
        <input type="number" step="1" placeholder="грн/кг" class="ing-price" value="${defaultPrice}" style="width:80px;">
    `;
    document.getElementById('newIngredientsInputs').appendChild(div);
}

function saveRecipe() {
    const name = document.getElementById('newRecipeName').value.trim();
    const yieldPercent = parseFloat(document.getElementById('newYieldPercent').value) || 80;
    
    if (!name) { alert("Укажите название рецепта"); return; }

    const names = document.querySelectorAll('.ing-name');
    const grams = document.querySelectorAll('.ing-grams');
    const prices = document.querySelectorAll('.ing-price');
    
    let list = [];
    for (let i = 0; i < names.length; i++) {
        let ingName = names[i].value.trim();
        let ingGrams = parseFloat(grams[i].value) || 0;
        let ingPrice = parseFloat(prices[i].value) || 0;
        
        if (ingName && ingGrams > 0) {
            list.push({ name: ingName, gramsPerKg: ingGrams, pricePerKg: ingPrice });
        }
    }

    if (list.length === 0) { alert("Добавьте хотя бы один компонент"); return; }

    recipes[name] = { yieldPercent: yieldPercent, ingredients: list };
    localStorage.setItem('dg_cost_recipes', JSON.stringify(recipes));
    
    cancelNewRecipe();
    init();
    document.getElementById('recipeSelect').value = name;
    loadSelectedRecipe();
}

function cancelNewRecipe() {
    document.getElementById('newRecipeBlock').style.display = 'none';
    document.getElementById('calculatorBlock').style.display = 'block';
}

function deleteCurrentRecipe() {
    const recipeName = document.getElementById('recipeSelect').value;
    if (!recipeName) return;

    if (confirm(`Удалить рецепт "${recipeName}"?`)) {
        delete recipes[recipeName];
        localStorage.setItem('dg_cost_recipes', JSON.stringify(recipes));
        init();
    }
}

init();
</script>
</body>
</html>
