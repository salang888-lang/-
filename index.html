<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дымный Гурман — Калькулятор и Себестоимость</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #1a1110;
            color: #f1e0d6;
            margin: 0;
            padding: 16px;
        }
        h2, h3, h4 { margin-top: 0; color: #f1e0d6; }
        .card {
            background-color: #2b1819;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid #4a2426;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        select, input, button {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #5e2c30;
            background: #3b1b1e;
            color: white;
            box-sizing: border-box;
            font-size: 15px;
            margin-bottom: 8px;
        }
        .weight-input {
            background: #4a1f23;
            border: 2px solid #d3524b;
            font-weight: bold;
            font-size: 16px;
            text-align: center;
            color: #ffda79;
            height: 44px;
        }
        .green-input {
            background: #1e382b;
            border: 2px solid #52d37c;
            color: #52d37c;
            font-weight: bold;
            font-size: 16px;
            text-align: center;
            height: 44px;
        }
        .sell-input {
            background: #3b1b1e;
            border: 2px solid #5e2c30;
            color: #ffffff;
            font-weight: bold;
            font-size: 16px;
            text-align: center;
            height: 44px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        .input-group label {
            font-size: 11px;
            color: #bda8a8;
            margin-bottom: 4px;
            height: 28px;
            display: flex;
            align-items: center;
        }
        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #34171a;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 6px;
            border-left: 3px solid #d3524b;
        }
        .row-name { font-size: 14px; flex: 2; }
        .row-val { font-size: 14px; font-weight: bold; color: #ff9d9d; flex: 1; text-align: right; }
        .row-cost { font-size: 13px; color: #bda8a8; flex: 1; text-align: right; }
        .fin-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px dashed #522429;
            font-size: 14px;
        }
        .fin-row strong { color: #52d37c; }
        .btn-main {
            background: #d3524b;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
            padding: 12px;
        }
        .btn-sec {
            background: #522429;
            color: white;
            border: none;
            cursor: pointer;
        }
        .btn-danger {
            background: transparent;
            color: #d3524b;
            border: 1px solid #d3524b;
            margin-top: 10px;
            cursor: pointer;
        }
        .ing-edit-row {
            display: flex;
            gap: 6px;
            margin-bottom: 6px;
        }
    </style>
</head>
<body>

    <h2>🔥 Дымный Гурман</h2>

    <!-- ВЫБОР РЕЦЕПТА -->
    <div class="card">
        <label style="font-size: 12px; color: #bda8a8;">Выберите рецепт:</label>
        <select id="recipeSelect" onchange="calculate()"></select>
        <button class="btn-sec" onclick="showNewRecipeForm()">➕ Добавить / Редактировать рецепт</button>
    </div>

    <!-- РАСЧЕТ И СЕБЕСТОИМОСТЬ -->
    <div class="card" id="calculatorBlock">
        <h3>Параметры партии и термообработки</h3>
        
        <label style="font-size: 12px; color: #bda8a8; margin-bottom: 4px; display: block;">Основное мясное сырье (кг):</label>
        <input type="number" id="meatWeight" class="weight-input" value="1.0" step="0.1" oninput="calculate()">

        <div style="display: flex; gap: 8px; margin-top: 6px;">
            <div class="input-group">
                <label>Вес ГОТОВОГО (кг):</label>
                <input type="number" id="finishedWeightInput" class="green-input" placeholder="0.850" step="0.01" oninput="calculate()">
            </div>
            <div class="input-group">
                <label>Цена продажи (грн/кг):</label>
                <input type="number" id="sellPrice" class="sell-input" placeholder="0" oninput="calculate()">
            </div>
        </div>

        <h4 style="margin-bottom: 8px; margin-top: 16px; color: #d3524b;">Ингредиенты замеса (до коптильни):</h4>
        <div id="resultsList"></div>

        <h4 style="margin-bottom: 8px; margin-top: 16px; color: #ffda79;">Итоговые показатели партии:</h4>
        <div id="financialBlock"></div>

        <button class="btn-danger" onclick="deleteCurrentRecipe()">🗑 Удалить этот рецепт</button>
    </div>

    <!-- ФОРМА СОЗДАНИЯ -->
    <div class="card" id="newRecipeBlock" style="display: none;">
        <h3>Создание / Правка рецепта</h3>
        <input type="text" id="newRecipeName" placeholder="Название (например: Краковская)">

        <div style="display: flex; gap: 6px; font-size: 11px; color: #bda8a8; margin-top: 8px;">
            <span style="flex:2;">Ингредиент</span>
            <span style="width:70px;">г на 1кг</span>
            <span style="width:80px;">грн/кг (л)</span>
        </div>
        
        <div id="newIngredientsInputs"></div>
        
        <button class="btn-sec" onclick="addIngredientInput()">+ Добавить компонент</button>
        <button class="btn-main" style="margin-top: 10px;" onclick="saveRecipe()">💾 Сохранить рецепт</button>
        <button class="btn-sec" style="margin-top: 5px; background: transparent;" onclick="cancelNewRecipe()">Отмена</button>
    </div>

<script>
let defaultRecipes = {
    "Краковская классика": {
        ingredients: [
            { name: "Свинина полужирная", gramsPerKg: 700, pricePerKg: 180 },
            { name: "Грудинка свиная", gramsPerKg: 300, pricePerKg: 160 },
            { name: "Вода ледяная / Лёд", gramsPerKg: 100, pricePerKg: 0 },
            { name: "Соль нитритная (0.5%)", gramsPerKg: 18, pricePerKg: 50 },
            { name: "Сахар / Декстроза", gramsPerKg: 2, pricePerKg: 40 },
            { name: "Перец чёрный молотый", gramsPerKg: 2, pricePerKg: 400 },
            { name: "Чеснок свежий", gramsPerKg: 2, pricePerKg: 120 },
            { name: "Фосфат пищевой", gramsPerKg: 3, pricePerKg: 220 },
            { name: "Оболочка коллаген 45мм", gramsPerKg: 2, pricePerKg: 15 }
        ]
    },
    "Кабаноси": {
        ingredients: [
            { name: "Свинина постная", gramsPerKg: 1000, pricePerKg: 190 },
            { name: "Вода ледяная", gramsPerKg: 50, pricePerKg: 0 },
            { name: "Соль нитритная", gramsPerKg: 20, pricePerKg: 50 },
            { name: "Паприка копчёная", gramsPerKg: 4, pricePerKg: 350 },
            { name: "Перец чёрный", gramsPerKg: 2, pricePerKg: 400 },
            { name: "Стартовые культуры", gramsPerKg: 0.6, pricePerKg: 2500 }
        ]
    }
};

let recipes = JSON.parse(localStorage.getItem('dg_cost_recipes_v2')) || defaultRecipes;

function init() {
    const select = document.getElementById('recipeSelect');
    select.innerHTML = '';
    for (let name in recipes) {
        let opt = document.createElement('option');
        opt.value = name;
        opt.innerText = name;
        select.appendChild(opt);
    }
    calculate();
}

function calculate() {
    const recipeName = document.getElementById('recipeSelect').value;
    const baseMeatKg = parseFloat(document.getElementById('meatWeight').value) || 0;
    const finishedWeight = parseFloat(document.getElementById('finishedWeightInput').value) || 0;
    const sellPrice = parseFloat(document.getElementById('sellPrice').value) || 0;
    
    const resultsList = document.getElementById('resultsList');
    const financialBlock = document.getElementById('financialBlock');
    
    if (!recipeName || !recipes[recipeName]) {
        resultsList.innerHTML = '<div style="color:#bda8a8; text-align:center;">Выберите или создайте рецепт</div>';
        financialBlock.innerHTML = '';
        return;
    }

    const ingredients = recipes[recipeName].ingredients;
    resultsList.innerHTML = '';
    
    let totalBatchCost = 0;
    let totalRawWeightGrams = 0;

    ingredients.forEach(item => {
        const totalGrams = item.gramsPerKg * baseMeatKg;
        totalRawWeightGrams += totalGrams;

        const itemCost = (totalGrams / 1000) * (item.pricePerKg || 0);
        totalBatchCost += itemCost;

        const row = document.createElement('div');
        row.className = 'row';
        row.innerHTML = `
            <span class="row-name">${item.name}</span>
            <span class="row-val">${totalGrams < 1000 ? totalGrams.toFixed(1) + ' г' : (totalGrams/1000).toFixed(3) + ' кг'}</span>
            <span class="row-cost">${itemCost.toFixed(2)} грн</span>
        `;
        resultsList.appendChild(row);
    });

    const totalRawKg = (totalRawWeightGrams / 1000).toFixed(3);

    if (finishedWeight > 0) {
        const weightLossKg = (totalRawKg - finishedWeight).toFixed(3);
        const shrinkagePct = ((weightLossKg / totalRawKg) * 100).toFixed(1);
        const yieldPct = ((finishedWeight / totalRawKg) * 100).toFixed(1);
        const costPerKgFinished = (totalBatchCost / finishedWeight).toFixed(2);
        
        const revenue = (finishedWeight * sellPrice).toFixed(2);
        const profit = (revenue - totalBatchCost).toFixed(2);

        financialBlock.innerHTML = `
            <div class="fin-row"><span>Общий вес замеса до коптильни:</span> <span><strong>${totalRawKg} кг</strong></span></div>
            <div class="fin-row"><span>Общие затраты на партию:</span> <span><strong>${totalBatchCost.toFixed(2)} грн</strong></span></div>
            <div class="fin-row"><span>Потеря веса (усушка):</span> <span style="color:#ff9d9d;">${weightLossKg} кг (${shrinkagePct}%)</span></div>
            <div class="fin-row"><span>Фактический выход:</span> <span style="color:#52d37c; font-weight:bold;">${yieldPct}% (${finishedWeight} кг)</span></div>
            <div class="fin-row" style="font-size:16px;"><span>СЕБЕСТОИМОСТЬ 1 КГ ГОТОВОГО:</span> <span style="color:#ffda79; font-weight:bold;">${costPerKgFinished} грн/кг</span></div>
            ${sellPrice > 0 ? `
                <div class="fin-row"><span>Выручка от продажи:</span> <span>${revenue} грн</span></div>
                <div class="fin-row"><span>Чистая прибыль с партии:</span> <span style="color:#52d37c; font-weight:bold;">${profit} грн</span></div>
            ` : ''}
        `;
    } else {
        financialBlock.innerHTML = `
            <div class="fin-row"><span>Общий вес замеса до коптильни:</span> <span><strong>${totalRawKg} кг</strong></span></div>
            <div class="fin-row"><span>Общие затраты на партию:</span> <span><strong>${totalBatchCost.toFixed(2)} грн</strong></span></div>
            <div style="color:#bda8a8; font-size:12px; margin-top:8px; text-align:center;">👈 Введите вес готового продукта после копчения, чтобы посчитать усушку и себестоимость 1 кг.</div>
        `;
    }
}

function showNewRecipeForm() {
    document.getElementById('newRecipeBlock').style.display = 'block';
    document.getElementById('calculatorBlock').style.display = 'none';
    document.getElementById('newIngredientsInputs').innerHTML = '';
    document.getElementById('newRecipeName').value = '';
    
    addIngredientInput("Свинина полужирная", 700, 180);
    addIngredientInput("Грудинка", 300, 160);
    addIngredientInput("Вода ледяная", 100, 0);
    addIngredientInput("Соль нитритная", 18, 50);
    addIngredientInput("Специи", 5, 400);
}

function addIngredientInput(defaultName = '', defaultGrams = '', defaultPrice = '') {
    const div = document.createElement('div');
    div.className = 'ing-edit-row';
    div.innerHTML = `
        <input type="text" placeholder="Название" class="ing-name" value="${defaultName}" style="flex:2;">
        <input type="number" step="0.1" placeholder="г/кг" class="ing-grams" value="${defaultGrams}" style="width:70px;">
        <input type="number" step="1" placeholder="грн/кг" class="ing-price" value="${defaultPrice}" style="width:80px;">
    `;
    document.getElementById('newIngredientsInputs').appendChild(div);
}

function saveRecipe() {
    const name = document.getElementById('newRecipeName').value.trim();
    if (!name) { alert("Укажите название рецепта"); return; }

    const names = document.querySelectorAll('.ing-name');
    const grams = document.querySelectorAll('.ing-grams');
    const prices = document.querySelectorAll('.ing-price');
    
    let list = [];
    for (let i = 0; i < names.length; i++) {
        let ingName = names[i].value.trim();
        let ingGrams = parseFloat(grams[i].value) || 0;
        let ingPrice = parseFloat(prices[i].value) || 0;
        
        if (ingName && ingGrams > 0) {
            list.push({ name: ingName, gramsPerKg: ingGrams, pricePerKg: ingPrice });
        }
    }

    if (list.length === 0) { alert("Добавьте хотя бы один компонент"); return; }

    recipes[name] = { ingredients: list };
    localStorage.setItem('dg_cost_recipes_v2', JSON.stringify(recipes));
    
    cancelNewRecipe();
    init();
    document.getElementById('recipeSelect').value = name;
    calculate();
}

function cancelNewRecipe() {
    document.getElementById('newRecipeBlock').style.display = 'none';
    document.getElementById('calculatorBlock').style.display = 'block';
}

function deleteCurrentRecipe() {
    const recipeName = document.getElementById('recipeSelect').value;
    if (!recipeName) return;

    if (confirm(`Удалить рецепт "${recipeName}"?`)) {
        delete recipes[recipeName];
        localStorage.setItem('dg_cost_recipes_v2', JSON.stringify(recipes));
        init();
    }
}

init();
</script>
</body>
</html>
