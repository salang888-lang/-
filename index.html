<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дымный Гурман — Калькулятор</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #1a1110;
            color: #f1e0d6;
            margin: 0;
            padding: 12px;
        }
        h2, h3, h4 { margin-top: 0; color: #f1e0d6; }
        .card {
            background-color: #2b1819;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 16px;
            border: 1px solid #4a2426;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        /* ВКЛАДКИ НАВИГАЦИИ */
        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px 4px;
            background: #3b1b1e;
            border: 1px solid #5e2c30;
            color: #bda8a8;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        .tab-btn.active {
            background: #d3524b;
            color: white;
            border-color: #d3524b;
        }

        select, input, button {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #5e2c30;
            background: #3b1b1e;
            color: white;
            font-size: 15px;
            margin-bottom: 8px;
        }

        .input-row {
            display: flex;
            gap: 8px;
            margin-top: 6px;
            align-items: flex-end;
        }
        .input-col {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .input-col label {
            font-size: 11px;
            color: #bda8a8;
            margin-bottom: 4px;
            white-space: nowrap;
        }
        .input-col input {
            height: 44px;
            margin-bottom: 0;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
        }

        .weight-input { background: #4a1f23; border: 2px solid #d3524b !important; color: #ffda79; }
        .green-input { background: #1e382b; border: 2px solid #52d37c !important; color: #52d37c; }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #34171a;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 6px;
            border-left: 3px solid #d3524b;
        }
        .row-name { font-size: 14px; flex: 2; }
        .row-val { font-size: 14px; font-weight: bold; color: #ff9d9d; flex: 1; text-align: right; }
        .row-cost { font-size: 13px; color: #bda8a8; flex: 1; text-align: right; }

        .multi-recipe-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: #3a1c1f;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 3px solid #ffda79;
        }
        .multi-header {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .multi-header input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin-bottom: 0;
            cursor: pointer;
        }
        .multi-inputs {
            display: flex;
            gap: 8px;
            align-items: center;
            padding-left: 28px;
        }
        .multi-inputs div {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .multi-inputs label {
            font-size: 10px;
            color: #bda8a8;
            margin-bottom: 2px;
        }
        .multi-inputs input[type="number"] {
            margin-bottom: 0;
            text-align: center;
            font-weight: bold;
            height: 38px;
            font-size: 14px;
        }

        .fin-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px dashed #522429;
            font-size: 14px;
        }
        
        .btn-main { background: #d3524b; color: white; font-weight: bold; border: none; cursor: pointer; padding: 12px; font-size: 16px; }
        .btn-sec { background: #522429; color: white; border: none; cursor: pointer; }
        .btn-danger { background: transparent; color: #d3524b; border: 1px solid #d3524b; cursor: pointer; }
        .ing-edit-row { display: flex; gap: 6px; margin-bottom: 6px; }
    </style>
</head>
<body>

    <h2>🔥 Дымный Гурман</h2>

    <!-- Вкладки навигации -->
    <div class="tabs">
        <div class="tab-btn active" id="tab_single" onclick="switchTab('single')">1 Рецепт</div>
        <div class="tab-btn" id="tab_multi" onclick="switchTab('multi')">💨 Загрузка Камеры</div>
        <div class="tab-btn" id="tab_recipes" onclick="switchTab('recipes')">📖 Мои Рецепты</div>
    </div>

    <!-- 1. ВКТАДКА: ОДИН РЕЦЕПТ -->
    <div id="section_single">
        <div class="card">
            <label style="font-size: 12px; color: #bda8a8; display: block; margin-bottom: 4px;">Выберите рецепт:</label>
            <select id="recipeSelect" onchange="calculateSingle()"></select>
            
            <h3 style="margin-top: 14px;">Параметры партии</h3>
            <label style="font-size: 12px; color: #bda8a8; margin-bottom: 4px; display: block;">Мясное сырье (кг):</label>
            <input type="number" id="meatWeight" class="weight-input" style="height: 44px;" value="1.0" step="0.1" oninput="calculateSingle()">

            <div class="input-row">
                <div class="input-col">
                    <label>Вес ГОТОВОГО (кг):</label>
                    <input type="number" id="finishedWeightInput" class="green-input" placeholder="0.850" step="0.01" oninput="calculateSingle()">
                </div>
                <div class="input-col">
                    <label>Цена продажи (грн/кг):</label>
                    <input type="number" id="sellPrice" placeholder="0" oninput="calculateSingle()">
                </div>
            </div>

            <h4 style="margin-bottom: 8px; margin-top: 16px; color: #d3524b;">Ингредиенты замеса:</h4>
            <div id="resultsList"></div>

            <h4 style="margin-bottom: 8px; margin-top: 16px; color: #ffda79;">Итоги по 1 рецепту:</h4>
            <div id="financialBlock"></div>
        </div>
    </div>

    <!-- 2. ВКЛАДКА: ЗАГРУЗКА КАМЕРЫ -->
    <div id="section_multi" style="display: none;">
        <div class="card">
            <h3 style="color: #ffda79;">💨 Сборная партия / Загрузка коптильни</h3>
            <p style="font-size: 12px; color: #bda8a8; margin-top: -6px;">Укажите сырьё и цену продажи для каждого изделия:</p>
            
            <div id="multiRecipesList"></div>

            <hr style="border: 0; border-top: 1px dashed #5e2c30; margin: 16px 0;">

            <div class="input-row">
                <div class="input-col">
                    <label>Вес всей партии ПОСЛЕ коптильни (кг):</label>
                    <input type="number" id="multiFinishedWeight" class="green-input" placeholder="например: 4.200" step="0.05">
                </div>
            </div>

            <button class="btn-main" style="margin-top: 12px;" onclick="calculateMultiBatch()">🔥 Посчитать всю партию</button>

            <div id="multiResultsBlock" style="margin-top: 14px;"></div>
        </div>
    </div>

    <!-- 3. ВКЛАДКА: МОИ РЕЦЕПТЫ (Управление и создание) -->
    <div id="section_recipes" style="display: none;">
        <div class="card">
            <h3>📖 Управление рецептами</h3>
            <button class="btn-main" onclick="showNewRecipeForm()">➕ Создать новый рецепт</button>
            
            <h4 style="margin-top:16px; color:#ffda79;">Сохранённые рецепты:</h4>
            <div id="recipeManagerList"></div>
        </div>

        <!-- ФОРМА СОЗДАНИЯ/РЕДАКТИРОВАНИЯ -->
        <div class="card" id="newRecipeBlock" style="display: none;">
            <h3 id="formTitle">Новый рецепт</h3>
            <input type="text" id="newRecipeName" placeholder="Название (например: Краковская)">

            <div style="display: flex; gap: 6px; font-size: 11px; color: #bda8a8; margin-top: 8px;">
                <span style="flex:2;">Ингредиент</span>
                <span style="width:70px;">г на 1кг</span>
                <span style="width:80px;">грн/кг</span>
            </div>
            
            <div id="newIngredientsInputs"></div>
            
            <button class="btn-sec" onclick="addIngredientInput()">+ Добавить компонент</button>
            <button class="btn-main" style="margin-top: 10px;" onclick="saveRecipe()">💾 Сохранить рецепт</button>
            <button class="btn-sec" style="margin-top: 5px; background: transparent;" onclick="cancelNewRecipe()">Отмена</button>
        </div>
    </div>

<script>
let defaultRecipes = {
    "Краковская классика": {
        ingredients: [
            { name: "Свинина полужирная", gramsPerKg: 700, pricePerKg: 180 },
            { name: "Грудинка свиная", gramsPerKg: 300, pricePerKg: 160 },
            { name: "Вода ледяная / Лёд", gramsPerKg: 100, pricePerKg: 0 },
            { name: "Соль нитритная (0.5%)", gramsPerKg: 18, pricePerKg: 50 },
            { name: "Сахар / Декстроза", gramsPerKg: 2, pricePerKg: 40 },
            { name: "Перец чёрный молотый", gramsPerKg: 2, pricePerKg: 400 },
            { name: "Чеснок свежий", gramsPerKg: 2, pricePerKg: 120 },
            { name: "Фосфат пищевой", gramsPerKg: 3, pricePerKg: 220 },
            { name: "Оболочка коллаген 45мм", gramsPerKg: 2, pricePerKg: 15 }
        ]
    },
    "Кабаноси": {
        ingredients: [
            { name: "Свинина постная", gramsPerKg: 1000, pricePerKg: 190 },
            { name: "Вода ледяная", gramsPerKg: 50, pricePerKg: 0 },
            { name: "Соль нитритная", gramsPerKg: 20, pricePerKg: 50 },
            { name: "Паприка копчёная", gramsPerKg: 4, pricePerKg: 350 },
            { name: "Перец чёрный", gramsPerKg: 2, pricePerKg: 400 },
            { name: "Стартовые культуры", gramsPerKg: 0.6, pricePerKg: 2500 }
        ]
    }
};

let recipes = JSON.parse(localStorage.getItem('dg_cost_recipes_v2')) || defaultRecipes;

function init() {
    updateRecipeSelect();
    calculateSingle();
    renderMultiRecipesList();
    renderRecipeManagerList();
}

function switchTab(tab) {
    document.getElementById('section_single').style.display = tab === 'single' ? 'block' : 'none';
    document.getElementById('section_multi').style.display = tab === 'multi' ? 'block' : 'none';
    document.getElementById('section_recipes').style.display = tab === 'recipes' ? 'block' : 'none';

    document.getElementById('tab_single').classList.toggle('active', tab === 'single');
    document.getElementById('tab_multi').classList.toggle('active', tab === 'multi');
    document.getElementById('tab_recipes').classList.toggle('active', tab === 'recipes');

    if (tab === 'multi') renderMultiRecipesList();
    if (tab === 'recipes') renderRecipeManagerList();
}

function updateRecipeSelect() {
    const s1 = document.getElementById('recipeSelect');
    s1.innerHTML = '';
    for (let name in recipes) {
        let opt1 = document.createElement('option');
        opt1.value = name; opt1.innerText = name;
        s1.appendChild(opt1);
    }
}

/* 1. РАСЧЕТ ОДНОГО РЕЦЕПТА */
function calculateSingle() {
    const recipeName = document.getElementById('recipeSelect').value;
    const baseMeatKg = parseFloat(document.getElementById('meatWeight').value) || 0;
    const finishedWeight = parseFloat(document.getElementById('finishedWeightInput').value) || 0;
    const sellPrice = parseFloat(document.getElementById('sellPrice').value) || 0;
    
    const resultsList = document.getElementById('resultsList');
    const financialBlock = document.getElementById('financialBlock');
    
    if (!recipeName || !recipes[recipeName]) {
        resultsList.innerHTML = '<div style="color:#bda8a8; text-align:center;">Выберите или создайте рецепт</div>';
        financialBlock.innerHTML = '';
        return;
    }

    const ingredients = recipes[recipeName].ingredients;
    resultsList.innerHTML = '';
    
    let totalBatchCost = 0;
    let totalRawWeightGrams = 0;

    ingredients.forEach(item => {
        const totalGrams = item.gramsPerKg * baseMeatKg;
        totalRawWeightGrams += totalGrams;

        const itemCost = (totalGrams / 1000) * (item.pricePerKg || 0);
        totalBatchCost += itemCost;

        const row = document.createElement('div');
        row.className = 'row';
        row.innerHTML = `
            <span class="row-name">${item.name}</span>
            <span class="row-val">${totalGrams < 1000 ? totalGrams.toFixed(1) + ' г' : (totalGrams/1000).toFixed(3) + ' кг'}</span>
            <span class="row-cost">${itemCost.toFixed(2)} грн</span>
        `;
        resultsList.appendChild(row);
    });

    const totalRawKg = (totalRawWeightGrams / 1000).toFixed(3);

    if (finishedWeight > 0) {
        const weightLossKg = (totalRawKg - finishedWeight).toFixed(3);
        const shrinkagePct = ((weightLossKg / totalRawKg) * 100).toFixed(1);
        const yieldPct = ((finishedWeight / totalRawKg) * 100).toFixed(1);
        const costPerKgFinished = (totalBatchCost / finishedWeight).toFixed(2);
        
        const revenue = (finishedWeight * sellPrice).toFixed(2);
        const profit = (revenue - totalBatchCost).toFixed(2);

        financialBlock.innerHTML = `
            <div class="fin-row"><span>Общий вес замеса до коптильни:</span> <span><strong>${totalRawKg} кг</strong></span></div>
            <div class="fin-row"><span>Затраты на партию:</span> <span><strong>${totalBatchCost.toFixed(2)} грн</strong></span></div>
            <div class="fin-row"><span>Потеря веса (усушка):</span> <span style="color:#ff9d9d;">${weightLossKg} кг (${shrinkagePct}%)</span></div>
            <div class="fin-row"><span>Фактический выход:</span> <span style="color:#52d37c; font-weight:bold;">${yieldPct}% (${finishedWeight} кг)</span></div>
            <div class="fin-row" style="font-size:15px;"><span>СЕБЕСТОИМОСТЬ 1 КГ ГОТОВОГО:</span> <span style="color:#ffda79; font-weight:bold;">${costPerKgFinished} грн/кг</span></div>
            ${sellPrice > 0 ? `
                <div class="fin-row"><span>Выручка от продажи:</span> <span>${revenue} грн</span></div>
                <div class="fin-row"><span>Чистая прибыль с партии:</span> <span style="color:#52d37c; font-weight:bold;">${profit} грн</span></div>
            ` : ''}
        `;
    } else {
        financialBlock.innerHTML = `
            <div class="fin-row"><span>Общий вес замеса до коптильни:</span> <span><strong>${totalRawKg} кг</strong></span></div>
            <div class="fin-row"><span>Затраты на партию:</span> <span><strong>${totalBatchCost.toFixed(2)} грн</strong></span></div>
        `;
    }
}

/* 2. РАСЧЕТ НЕСКОЛЬКИХ РЕЦЕПТОВ ДЛЯ КАМЕРЫ */
function renderMultiRecipesList() {
    const container = document.getElementById('multiRecipesList');
    container.innerHTML = '';

    let index = 0;
    for (let name in recipes) {
        const div = document.createElement('div');
        div.className = 'multi-recipe-item';
        div.innerHTML = `
            <div class="multi-header">
                <input type="checkbox" id="chk_${index}" value="${name}">
                <label for="chk_${index}" style="font-weight:bold; cursor:pointer; font-size:14px; color:#ffffff;">${name}</label>
            </div>
            <div class="multi-inputs">
                <div>
                    <label>Мясо (кг):</label>
                    <input type="number" id="kg_${index}" value="2.0" step="0.1">
                </div>
                <div>
                    <label>Цена прод. (грн/кг):</label>
                    <input type="number" id="price_${index}" placeholder="350" step="10">
                </div>
            </div>
        `;
        container.appendChild(div);
        index++;
    }
}

function calculateMultiBatch() {
    const resultsBlock = document.getElementById('multiResultsBlock');
    const finishedWeight = parseFloat(document.getElementById('multiFinishedWeight').value) || 0;

    let totalRawGrams = 0;
    let totalCost = 0;
    let consolidatedIngs = {};
    let selectedCount = 0;
    let weightedRevenueSum = 0;
    let totalMeatKgInBatch = 0;

    let index = 0;
    for (let name in recipes) {
        const chk = document.getElementById(`chk_${index}`);
        const kgInput = document.getElementById(`kg_${index}`);
        const priceInput = document.getElementById(`price_${index}`);

        if (chk && chk.checked) {
            selectedCount++;
            const meatKg = parseFloat(kgInput.value) || 0;
            const retailPrice = parseFloat(priceInput.value) || 0;
            const rec = recipes[name];

            totalMeatKgInBatch += meatKg;

            rec.ingredients.forEach(ing => {
                const ingGrams = ing.gramsPerKg * meatKg;
                const ingCost = (ingGrams / 1000) * (ing.pricePerKg || 0);

                totalRawGrams += ingGrams;
                totalCost += ingCost;

                if (!consolidatedIngs[ing.name]) {
                    consolidatedIngs[ing.name] = { grams: 0, cost: 0 };
                }
                consolidatedIngs[ing.name].grams += ingGrams;
                consolidatedIngs[ing.name].cost += ingCost;
            });

            if (retailPrice > 0) {
                weightedRevenueSum += (meatKg * retailPrice);
            }
        }
        index++;
    }

    if (selectedCount === 0) {
        resultsBlock.innerHTML = '<div style="color:#ff9d9d; text-align:center;">Выберите хотя бы один рецепт галочкой!</div>';
        return;
    }

    const totalRawKg = (totalRawGrams / 1000).toFixed(3);

    let html = `
        <h4 style="color:#d3524b; margin-bottom:8px;">Общий список закупок на ВСЮ коптильню:</h4>
    `;

    for (let ingName in consolidatedIngs) {
        const item = consolidatedIngs[ingName];
        html += `
            <div class="row">
                <span class="row-name">${ingName}</span>
                <span class="row-val">${item.grams < 1000 ? item.grams.toFixed(1) + ' г' : (item.grams/1000).toFixed(3) + ' кг'}</span>
                <span class="row-cost">${item.cost.toFixed(2)} грн</span>
            </div>
        `;
    }

    html += `
        <h4 style="color:#ffda79; margin-top:14px; margin-bottom:8px;">Итоги сборной партии:</h4>
        <div class="fin-row"><span>Общий вес закладки ДО коптильни:</span> <span><strong>${totalRawKg} кг</strong></span></div>
        <div class="fin-row"><span>Общая стоимость сырья/партии:</span> <span><strong>${totalCost.toFixed(2)} грн</strong></span></div>
    `;

    if (finishedWeight > 0) {
        const weightLossKg = (totalRawKg - finishedWeight).toFixed(3);
        const shrinkagePct = ((weightLossKg / totalRawKg) * 100).toFixed(1);
        const yieldPct = ((finishedWeight / totalRawKg) * 100).toFixed(1);
        const costPerKgFinished = (totalCost / finishedWeight).toFixed(2);

        const estimatedRevenue = (weightedRevenueSum * (finishedWeight / totalMeatKgInBatch)).toFixed(2);
        const estimatedProfit = (estimatedRevenue - totalCost).toFixed(2);

        html += `
            <div class="fin-row"><span>Общая потеря веса (усушка):</span> <span style="color:#ff9d9d;">${weightLossKg} кг (${shrinkagePct}%)</span></div>
            <div class="fin-row"><span>Выход готовой продукции:</span> <span style="color:#52d37c; font-weight:bold;">${yieldPct}% (${finishedWeight} кг)</span></div>
            <div class="fin-row" style="font-size:15px;"><span>СРЕДНЯЯ СЕБЕСТОИМОСТЬ ГОТОВОГО:</span> <span style="color:#ffda79; font-weight:bold;">${costPerKgFinished} грн/кг</span></div>
            ${weightedRevenueSum > 0 ? `
                <div class="fin-row"><span>Ожидаемая выручка с камеры:</span> <span style="color:#52d37c;">${estimatedRevenue} грн</span></div>
                <div class="fin-row" style="font-size:16px;"><span>ЧИСТАЯ ПРИБЫЛЬ С КАМЕРЫ:</span> <span style="color:#52d37c; font-weight:bold;">${estimatedProfit} грн</span></div>
            ` : ''}
        `;
    } else {
        html += `
            <div style="color:#bda8a8; font-size:12px; margin-top:8px; text-align:center;">👈 Введите вес всей партии ПОСЛЕ коптильни в поле выше, чтобы посчитать готовую себестоимость и прибыль.</div>
        `;
    }

    resultsBlock.innerHTML = html;
}

/* 3. УПРАВЛЕНИЕ РЕЦЕПТАМИ */
function renderRecipeManagerList() {
    const list = document.getElementById('recipeManagerList');
    list.innerHTML = '';

    for (let name in recipes) {
        const div = document.createElement('div');
        div.className = 'row';
        div.style.marginBottom = '8px';
        div.innerHTML = `
            <span class="row-name" style="font-weight:bold; font-size:15px;">${name}</span>
            <button onclick="editRecipe('${name}')" style="width: auto; margin-bottom:0; padding:6px 12px; background:#522429; border:none; margin-right:4px;">✏️</button>
            <button onclick="deleteRecipe('${name}')" style="width: auto; margin-bottom:0; padding:6px 12px; background:transparent; border:1px solid #d3524b; color:#d3524b;">🗑</button>
        `;
        list.appendChild(div);
    }
}

function showNewRecipeForm() {
    document.getElementById('newRecipeBlock').style.display = 'block';
    document.getElementById('formTitle').innerText = 'Новый рецепт';
    document.getElementById('newIngredientsInputs').innerHTML = '';
    document.getElementById('newRecipeName').value = '';
    
    addIngredientInput("Свинина полужирная", 700, 180);
    addIngredientInput("Грудинка", 300, 160);
    addIngredientInput("Вода ледяная", 100, 0);
    addIngredientInput("Соль нитритная", 18, 50);
    addIngredientInput("Специи", 5, 400);
}

function editRecipe(name) {
    const rec = recipes[name];
    if (!rec) return;

    document.getElementById('newRecipeBlock').style.display = 'block';
    document.getElementById('formTitle').innerText = 'Редактирование: ' + name;
    document.getElementById('newRecipeName').value = name;
    document.getElementById('newIngredientsInputs').innerHTML = '';

    rec.ingredients.forEach(ing => {
        addIngredientInput(ing.name, ing.gramsPerKg, ing.pricePerKg);
    });
}

function addIngredientInput(defaultName = '', defaultGrams = '', defaultPrice = '') {
    const div = document.createElement('div');
    div.className = 'ing-edit-row';
    div.innerHTML = `
        <input type="text" placeholder="Название" class="ing-name" value="${defaultName}" style="flex:2;">
        <input type="number" step="0.1" placeholder="г/кг" class="ing-grams" value="${defaultGrams}" style="width:70px;">
        <input type="number" step="1" placeholder="грн/кг" class="ing-price" value="${defaultPrice}" style="width:80px;">
    `;
    document.getElementById('newIngredientsInputs').appendChild(div);
}

function saveRecipe() {
    const name = document.getElementById('newRecipeName').value.trim();
    if (!name) { alert("Укажите название рецепта"); return; }

    const names = document.querySelectorAll('.ing-name');
    const grams = document.querySelectorAll('.ing-grams');
    const prices = document.querySelectorAll('.ing-price');
    
    let list = [];
    for (let i = 0; i < names.length; i++) {
        let ingName = names[i].value.trim();
        let ingGrams = parseFloat(grams[i].value) || 0;
        let ingPrice = parseFloat(prices[i].value) || 0;
        
        if (ingName && ingGrams > 0) {
            list.push({ name: ingName, gramsPerKg: ingGrams, pricePerKg: ingPrice });
        }
    }

    if (list.length === 0) { alert("Добавьте хотя бы один компонент"); return; }

    recipes[name] = { ingredients: list };
    localStorage.setItem('dg_cost_recipes_v2', JSON.stringify(recipes));
    
    cancelNewRecipe();
    init();
}

function cancelNewRecipe() {
    document.getElementById('newRecipeBlock').style.display = 'none';
}

function deleteRecipe(name) {
    if (confirm(`Удалить рецепт "${name}"?`)) {
        delete recipes[name];
        localStorage.setItem('dg_cost_recipes_v2', JSON.stringify(recipes));
        init();
    }
}

init();
</script>
</body>
</html>
